name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # uv lock --check fails if uv.lock drifts from pyproject.toml (a dependency
      # was edited without re-locking). --frozen below then installs exactly the
      # locked resolution — CI never resolves, so deps are reproducible.
      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install (locked, with dev extras)
        run: uv sync --frozen --extra dev

      # P1-6' hard guard (1): the offline test count must never drop below the
      # sampled baseline (scripts/ci_test_guard.py, MIN_OFFLINE_TESTS pinned
      # with its sampling date). This collects (~3s, no run) and fails on a
      # missing test file, broken collection, or an over-broad deselect — so a
      # later refactor cannot silently shed existing verification.
      - name: "Guard: offline test count baseline (hard)"
        run: uv run python scripts/ci_test_guard.py count

      # pytest's addopts deselects the `online` and `live` markers, so this runs
      # only the offline suite — no network, no real-money orders, CI-safe.
      # --junitxml feeds the warn-only wall-time guard below.
      - name: Run offline test suite
        run: uv run pytest --junitxml=pytest-offline.xml

      # P1-6' guard (2, warn-only): surface a large offline-suite wall-time
      # regression without failing the build (shared runners are noisy). The
      # threshold + sampling date live in scripts/ci_test_guard.py.
      - name: "Guard: offline suite wall time (warn only)"
        if: always()
        run: uv run python scripts/ci_test_guard.py walltime --junitxml pytest-offline.xml

  # P1-2: lint quality gate. The rule set is explicitly pinned in pyproject.toml
  # ([tool.ruff]) so this is deterministic regardless of ruff's upstream defaults
  # or machine-local config. Existing violations were baselined with targeted
  # `# noqa: <code>  (P1-2 baseline: ...)` comments, so this gate only fails on
  # *new* violations introduced after the baseline.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install (locked, with dev extras)
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check hermes_trader/ scripts/ tests/

      # T-22 闸门有效性自检：在历史提交上重放 lint 闸门，断言已知红灯快照
      # (a38df9e=164) 仍红、绿灯点 (cf5245e/HEAD) 仍绿。若有人削弱/收紧规则
      # 导致历史行为变化，此步失败 —— 让 lint 闸门无法被悄无声息地改动。
      - name: "Lint gate historical replay (T-22)"
        run: uv run python scripts/lint_gate_replay.py
