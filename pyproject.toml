[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-trader"
dynamic = ["version"]
description = "Autonomous quant trading agent for Hyperliquid perpetual markets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx[http2]>=0.27,<1",
    "certifi>=2024.7.4",
    "pydantic>=2.0",
    "hyperliquid-python-sdk>=0.23.0",
    "eth-account>=0.13.0",
    "msgpack>=1.1.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
hermes-trader = "hermes_trader.__main__:main"

[tool.hatch.version]
path = "hermes_trader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hermes_trader"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not online and not live'"
markers = [
    "online: exercises the live Hyperliquid public API (read-only); deselected by default (run with: pytest -m online)",
    "live: real-money e2e — places orders and calls the billable LLM; deselected by default and additionally requires HERMES_E2E=1 (run with: HERMES_E2E=1 pytest -m live)",
]

# P1-2: explicit, deterministic lint contract. Pinning the rule set here keeps
# CI (clean runner) and every developer machine in sync regardless of ruff's
# upstream default changes (e.g. 0.16 expanded the default set) or global user
# config. We deliberately opt into high-signal, low-noise checks only — pyflakes
# (F, real bugs: unused imports/vars, redefinitions, malformed literals) and
# import sorting (I) — and leave the large stylistic backlog (line length,
# blind-except, pyupgrade modernization) out of the gate for now.
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Dev/analysis tooling: unused locals and redefined fixtures are noise here.
"scripts/*" = ["F841", "F811"]
# Tests commonly redefine fixtures/helpers and bind results for readability.
"tests/*" = ["F841", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["hermes_trader"]
